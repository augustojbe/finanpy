{% extends 'base.html' %}

{% block title %}Página não encontrada — Finanpy{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
    <div class="text-center">
        <p class="text-8xl font-bold bg-gradient-to-r from-violet-400 to-indigo-400 bg-clip-text text-transparent">
            404
        </p>
        <h1 class="mt-4 text-2xl font-semibold text-white">
            Página não encontrada
        </h1>
        <p class="mt-2 text-gray-400 max-w-md mx-auto">
            A página que você está procurando não existe ou foi movida.
            Verifique o endereço e tente novamente.
        </p>
        <div class="mt-8">
            <a href="{% url 'dashboard' %}"
               class="inline-block bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold py-2.5 px-6 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                Voltar ao dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
