{% extends 'base_auth.html' %}

{% block title %}Excluir Transação — Finanpy{% endblock %}

{% block page_content %}
<div class="max-w-xl mx-auto">

    <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">

        <div class="mx-auto w-16 h-16 rounded-full bg-rose-500/10 flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
        </div>

        <h1 class="text-xl font-bold text-white mb-2">Excluir Transação</h1>

        <p class="text-gray-300 text-sm mb-6">
            Tem certeza que deseja excluir a transação <strong class="text-white">{{ object.description }}</strong> no valor de <strong class="text-white">R$ {{ object.amount|floatformat:2 }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="flex items-center justify-center gap-3">
                <button type="submit"
                        class="bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                    Sim, excluir
                </button>
                <a href="{% url 'transactions:list' %}"
                   class="border border-gray-600 hover:border-gray-500 text-gray-300 hover:text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 hover:bg-gray-800">
                    Cancelar
                </a>
            </div>
        </form>

    </div>

</div>
{% endblock %}
